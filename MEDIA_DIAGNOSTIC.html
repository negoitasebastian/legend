<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTP2 Media Diagnostic</title><style>
:root{font-family:system-ui,sans-serif;color:#f2eaff;background:#100b23}body{margin:0;padding:25px;background:radial-gradient(circle at 50% 0,#53317b,#100b23 75%)}main{max-width:1150px;margin:auto}.top{background:#23163e;border:1px solid #9674df;padding:25px;border-radius:20px}h1{font-size:clamp(30px,6vw,62px);margin:8px 0;color:#8cfff7}h2{margin-top:35px}a{color:#8cfff7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:10px}.item{padding:14px;border:1px solid #634985;border-radius:12px;background:#211638}.item strong,.item small{display:block}.item small{color:#af9ecb;margin:5px 0}.item b{color:#ffd68c}.item.ok{border-color:#65dda7}.item.ok b{color:#8cffc1}.controls{display:flex;gap:13px;align-items:center;flex-wrap:wrap}button{cursor:pointer;background:#9ef7ec;border:0;border-radius:10px;padding:10px 15px;font-weight:800}</style></head><body><main><section class="top"><a href="./index.html">← Back to game</a><h1>MEDIA DIAGNOSTIC</h1><p>Live check of local images and voice manifests. No fake success status. Spoiler alert: location and Legend names are listed.</p><div class="controls"><button id="rerun">CHECK ALL FILES</button><span id="summary">Ready.</span></div></section><h2>Map captures</h2><div class="grid" id="maps"></div><h2>Ability icons</h2><div class="grid" id="abilities"></div><h2>Human voice manifest</h2><div class="grid" id="voices"></div></main><script type="module">
import {LOCATIONS} from './src/maps.mjs';import {localAbilitySlugs} from './src/abilities.mjs';import {authorizedVoiceSlugs,authorizedVoiceExt} from './src/voice_manifest.mjs';
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function exists(paths){for(const path of paths){try{const r=await fetch(path,{cache:'no-cache'});if(!r.ok)continue;const h=r.headers.get('content-type')||'';if(h.includes('text/html'))continue;return path;}catch{}}return null;}
async function check(){const rows=await Promise.all(LOCATIONS.map(async loc=>({...loc,path:await exists(['webp','png','jpg','jpeg'].map(ext=>`./assets/maps/${loc.id}.${ext}`))})));const icon=await Promise.all(localAbilitySlugs.map(async slug=>({slug,path:await exists(['png','webp','jpg','jpeg','svg'].map(ext=>`./assets/ability-icons/${slug}.${ext}`))})));const voices=await Promise.all(authorizedVoiceSlugs.map(async slug=>({slug,path:await exists([`./assets/voices/${slug}.${authorizedVoiceExt[slug]||'mp3'}`])})));document.querySelector('#maps').innerHTML=rows.map(o=>`<div class="item ${o.path?'ok':''}"><strong>${escape(o.map)} · ${escape(o.poi)}</strong><small>${escape(o.kind)} / ${escape(o.id)}</small><b>${o.path?'✓ '+escape(o.path):'— No local capture'}</b></div>`).join('');document.querySelector('#abilities').innerHTML=icon.map(o=>`<div class="item ${o.path?'ok':''}"><strong>${escape(o.slug)}</strong><b>${o.path?'✓ Installed':'— Missing'}</b></div>`).join('');document.querySelector('#voices').innerHTML=voices.length?voices.map(o=>`<div class="item ${o.path?'ok':''}"><strong>${escape(o.slug)}</strong><b>${o.path?'✓ Installed':'— Manifest points to missing file'}</b></div>`).join(''):'<div class="item">No human recordings declared. Import them using Media Studio.</div>';document.querySelector('#summary').textContent=`${rows.filter(x=>x.path).length}/${rows.length} maps · ${icon.filter(x=>x.path).length}/${icon.length} ability icons · ${voices.filter(x=>x.path).length} voices`}
document.querySelector('#rerun').addEventListener('click',check);check();
</script></body></html>
